<style>
  @page { size: Letter; margin: 40pt; }
  body { margin: 0; font-family: Helvetica, Arial, sans-serif; color: #111; font-size: 13px; }
  .panel {
    width: 390px;
    padding: 14px 16px;
    border: 1px solid #94a3b8;
    border-radius: 8px;
    background: #f8fafc;
  }
  h2 { margin: 0 0 10px 0; }
  p { margin: 0 0 8px 0; line-height: 1.25; }
  strong { color: #0f172a; }
  .muted { color: #64748b; }
</style>
<div class="panel">
  <h2>Inline whitespace</h2>
  <p>Hello <strong>bold</strong> <span class="muted">world</span> with inline spacing.</p>
  <p><span>Leading wrappers</span> <strong>should</strong> <span>keep spaces.</span></p>
</div>
