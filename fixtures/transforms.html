<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>2D transforms comparison</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #172033;
      font: 14px/1.25 Arial, sans-serif;
    }
    h1 { margin: 0 0 14px; font-size: 23px; }
    .stage {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 680px;
      gap: 18px;
    }
    .cell {
      position: relative;
      height: 180px;
      overflow: hidden;
      background: #f4f7fb;
      border: 1px solid #cbd5e1;
    }
    .axis-x, .axis-y {
      position: absolute;
      background: #cbd5e1;
    }
    .axis-x { left: 0; top: 89px; width: 100%; height: 1px; }
    .axis-y { left: 50%; top: 0; width: 1px; height: 180px; }
    .label {
      position: absolute;
      left: 8px;
      top: 7px;
      color: #526174;
      font-size: 11px;
    }
    .box {
      position: absolute;
      left: 95px;
      top: 58px;
      width: 120px;
      height: 62px;
      padding: 10px;
      color: #14305c;
      background: #dbeafe;
      border: 2px solid #2563eb;
      border-radius: 7px;
      font-weight: bold;
    }
    .origin {
      transform-origin: left top;
      transform: rotate(20deg);
    }
    .translate {
      transform: translate(calc(50% - 12px), 18px);
    }
    .scale {
      transform: scale(1.35, .65);
    }
    .ordered {
      transform-origin: 25% 75%;
      transform: translate(24px, -8px) rotate(18deg) scale(.85, 1.15);
    }
    .skew {
      transform: skewX(-18deg) skewY(6deg);
    }
    .matrix {
      transform-origin: center;
      transform: matrix(1, .18, -.28, 1, 18, -6);
    }
  </style>
</head>
<body>
  <h1>CSS 2D transforms</h1>
  <div class="stage">
    <div class="cell">
      <div class="axis-x"></div><div class="axis-y"></div>
      <div class="label">origin: left top · rotate(20deg)</div>
      <div class="box origin">Origin</div>
    </div>
    <div class="cell">
      <div class="axis-x"></div><div class="axis-y"></div>
      <div class="label">translate(calc(50% − 12px), 18px)</div>
      <div class="box translate">Translate</div>
    </div>
    <div class="cell">
      <div class="axis-x"></div><div class="axis-y"></div>
      <div class="label">scale(1.35, .65)</div>
      <div class="box scale">Scale</div>
    </div>
    <div class="cell">
      <div class="axis-x"></div><div class="axis-y"></div>
      <div class="label">translate · rotate · scale</div>
      <div class="box ordered">Ordered</div>
    </div>
    <div class="cell">
      <div class="axis-x"></div><div class="axis-y"></div>
      <div class="label">skewX(−18deg) · skewY(6deg)</div>
      <div class="box skew">Skew</div>
    </div>
    <div class="cell">
      <div class="axis-x"></div><div class="axis-y"></div>
      <div class="label">matrix(1, .18, −.28, 1, 18, −6)</div>
      <div class="box matrix">Matrix</div>
    </div>
  </div>
</body>
</html>
