<style>
  @page { size: Letter; margin: 40pt; }
  body { margin: 0; font-family: Helvetica, Arial, sans-serif; color: #111; font-size: 13px; }
  .page {
    width: 430px;
    padding: 14px 16px;
    border: 1px solid #94a3b8;
    background: #f8fafc;
  }
  h2 { margin: 0 0 12px 0; }
  p { margin: 0 0 10px 0; line-height: 1.25; }
  .box {
    margin-top: 8px;
    padding: 8px 10px;
    background: #dbeafe;
    border: 1px solid #93c5fd;
  }
  .wide { width: 100%; max-width: 260px; }
  .auto { max-width: 210px; }
  .floor { width: 90px; min-width: 180px; background: #dcfce7; border-color: #86efac; }
</style>
<div class="page">
  <h2>Width constraints</h2>
  <p>Max-width should clamp a percentage width and an auto block width. Min-width should raise a too-small explicit width.</p>
  <div class="box wide">width: 100%; max-width: 260px</div>
  <div class="box auto">max-width: 210px</div>
  <div class="box floor">width: 90px; min-width: 180px</div>
</div>
