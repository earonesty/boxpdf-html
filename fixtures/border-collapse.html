<style>
  @page { size: Letter; margin: 40pt; }
  body { margin: 0; font-family: Helvetica, Arial, sans-serif; color: #111; font-size: 13px; }
  .panel {
    width: 420px;
    padding: 14px 16px;
    border: 1px solid #94a3b8;
    border-radius: 8px;
    background: #f8fafc;
  }
  h2 { margin: 0 0 10px 0; }
  p { margin: 0 0 12px 0; line-height: 1.25; }
  table {
    width: 388px;
    border-collapse: collapse;
  }
  th, td {
    padding: 7px 9px;
    border: 1px solid #cbd5e1;
    text-align: left;
  }
  th {
    background: #e2e8f0;
    font-weight: 700;
  }
  td.total {
    text-align: right;
  }
</style>
<div class="panel">
  <h2>Collapsed table borders</h2>
  <p>Shared table borders should render as single grid lines.</p>
  <table>
    <tr>
      <th>Item</th>
      <th>Qty</th>
      <th>Total</th>
    </tr>
    <tr>
      <td>Notebook</td>
      <td>3</td>
      <td class="total">$27.00</td>
    </tr>
    <tr>
      <td>Coffee mug</td>
      <td>1</td>
      <td class="total">$18.00</td>
    </tr>
  </table>
</div>
