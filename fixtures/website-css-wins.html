<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.35;
      margin: 0;
    }
    .shell {
      width: 420px;
      margin: 0 auto;
      border: 1px solid #222;
      padding: 12px;
    }
    .top {
      display: flex;
      flex-direction: row-reverse;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }
    .tag {
      background: #111;
      color: white;
      padding: 3px 7px;
      font-size: 11px;
    }
    .media {
      display: flex;
      flex-direction: column-reverse;
      gap: 6px;
      margin-bottom: 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      column-gap: 10px;
      row-gap: 8px;
      margin-bottom: 12px;
    }
    .cell {
      border: 1px solid #aaa;
      padding: 6px;
    }
    .wide {
      grid-column: 2 / span 2;
      background: #f1f5f9;
    }
    img {
      width: 160px;
      height: 90px;
      border: 1px solid #777;
      display: block;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="top">
      <span class="tag">RIGHT FIRST</span>
      <strong>Auto margins center this card</strong>
    </div>
    <div class="media">
      <p>The caption comes after the image in the DOM, but column-reverse places it first.</p>
      <img src="missing-news-photo.jpg" alt="">
    </div>
    <div class="grid">
      <div class="cell">One fraction column</div>
      <div class="cell wide">This item starts in column two and spans the wider remaining area.</div>
      <div class="cell">Next row starts normally.</div>
    </div>
  </div>
</body>
</html>
