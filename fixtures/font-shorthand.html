<!doctype html>
<html>
<head>
<style>
  @page { size: Letter; margin: 40pt; }
  body { margin: 0; font-family: Helvetica, Arial, sans-serif; color: #172033; font-size: 14px; }
  h1 { font: 700 20px/1.2 Helvetica, Arial, sans-serif; margin: 0 0 12px 0; }
  p { margin: 0 0 10px 0; width: 390px; }
  .lead { font: italic 700 16px/1.45 Helvetica, Arial, sans-serif; color: #1e40af; }
  .caption { font: 11px/1.3 Helvetica, Arial, sans-serif; color: #64748b; }
  .mixed { font: bold 13px/1.6 Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
  <h1>Font shorthand</h1>
  <p class="lead">This line should be bold italic with a larger line height from the font shorthand.</p>
  <p class="caption">Caption text should be smaller and muted while preserving the shorthand family list.</p>
  <p class="mixed">Bold shorthand should match normal longhand font-weight and font-size behavior.</p>
</body>
</html>
