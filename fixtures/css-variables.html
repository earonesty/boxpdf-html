<!doctype html>
<html>
<head>
<style>
  @page { size: Letter; margin: 40pt; }
  :root {
    --ink: #172033;
    --brand: #2563eb;
    --panel-bg: #eff6ff;
    --accent: #16a34a;
    --danger: var(--missing-danger, #dc2626);
    --space: 12px;
    --radius: 6px;
  }
  body {
    margin: 0;
    color: var(--ink);
    font: 14px/1.3 Helvetica, Arial, sans-serif;
  }
  h1 {
    font: 700 20px/1.2 Helvetica, Arial, sans-serif;
    margin: 0 0 var(--space) 0;
  }
  .panel {
    width: 390px;
    padding: var(--space);
    border: 1px solid var(--brand);
    border-radius: var(--radius);
    background: var(--panel-bg);
  }
  .panel p { margin: 0 0 10px 0; }
  .panel strong { color: var(--brand); }
  .local {
    --brand: var(--accent);
    color: var(--brand);
    border-left: 4px solid var(--brand);
    padding-left: var(--space);
  }
  .fallback { color: var(--danger); }
</style>
</head>
<body>
  <h1>CSS variables</h1>
  <div class="panel">
    <p>Panel colors, spacing, and radius should come from <strong>custom properties</strong>.</p>
    <p class="local">A local variable override should turn this line green.</p>
    <p class="fallback">Fallback values should resolve when a token is missing.</p>
  </div>
</body>
</html>
