name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    working-directory: boxpdf-html

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout boxpdf-html
        uses: actions/checkout@v7
        with:
          path: boxpdf-html
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.30.3"
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: boxpdf-html/pnpm-lock.yaml
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Check npm package version
        id: npm_version
        run: |
          PACKAGE="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          LOOKUP_ERROR="$(mktemp)"
          trap 'rm -f "$LOOKUP_ERROR"' EXIT
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>"$LOOKUP_ERROR"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            STATUS=$?
            if grep -Eq '^npm (ERR!|error) code E404$' "$LOOKUP_ERROR"; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
            else
              cat "$LOOKUP_ERROR" >&2
              exit "$STATUS"
            fi
          fi

      - name: Publish to npm
        if: steps.npm_version.outputs.exists != 'true'
        run: node scripts/prepare-publish.mjs --publish
        env:
          NPM_CONFIG_PROVENANCE: "true"

      # Publish to the MCP registry. npm ownership is proven by the `mcpName`
      # field in package.json; the io.github.earonesty/* namespace is authorized
      # via GitHub Actions OIDC (id-token: write, already granted above).
      # Tag-only: a manual workflow_dispatch run (GITHUB_REF is a branch, not a
      # tag) still publishes to npm but skips these registry steps.
      - name: Install mcp-publisher
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Sync server.json version to the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Authenticate to MCP registry (GitHub OIDC)
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./mcp-publisher publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
