name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    working-directory: boxpdf-html

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout boxpdf-html
        uses: actions/checkout@v7
        with:
          path: boxpdf-html
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.30.3"
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: boxpdf-html/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install visual dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-dejavu-core

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Check streamed visual parity
        run: pnpm run visual:check:stream

      - name: Check streamed CLI
        run: pnpm run visual:check:stream-cli

      - name: Check bounded stream memory
        run: pnpm run memory:check:stream

      - name: Pack release tarball
        run: pnpm run pack:release
