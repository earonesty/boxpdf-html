name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    working-directory: boxpdf-html

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout boxpdf-html
        uses: actions/checkout@v7
        with:
          path: boxpdf-html
          persist-credentials: false

      - name: Checkout linked boxpdf streaming branch
        uses: actions/checkout@v7
        with:
          repository: earonesty/boxpdf
          ref: agent/streaming-html
          path: boxpdf
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: boxpdf-html/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build linked boxpdf
        working-directory: boxpdf
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Pack and link streaming boxpdf
        run: |
          mkdir .linked-core
          pnpm --dir ../boxpdf pack --pack-destination "$PWD/.linked-core"
          mkdir .linked-core/package
          tar -xzf .linked-core/boxpdf-*.tgz -C .linked-core/package --strip-components=1
          mkdir .linked-core/package/node_modules
          ln -s "$GITHUB_WORKSPACE/boxpdf/node_modules/@pdf-lib" .linked-core/package/node_modules/@pdf-lib
          unlink node_modules/boxpdf
          ln -s "$PWD/.linked-core/package" node_modules/boxpdf

      - name: Install visual dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-dejavu-core

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Check streamed visual parity
        run: pnpm run visual:check:stream

      - name: Check streamed CLI
        run: pnpm run visual:check:stream-cli

      - name: Check bounded stream memory
        run: pnpm run memory:check:stream

      - name: Pack release tarball
        run: pnpm run pack:release
